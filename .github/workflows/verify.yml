name: Verify prototype
on:
  pull_request:
permissions:
  contents: read
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test only local Firebase emulators
        run: npx firebase emulators:exec --only auth,firestore --project demo-bloodconnect-zc "npm test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            artifacts/
            *-debug.log
